<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt vé xem phim online</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin: auto;
            background: linear-gradient(to right, #c1121f, #1656af);
            border-radius: 20px;
            margin-bottom: 10px;
            box-shadow: 0 10px 20px #000d49;
        }
        .logo img{
            height: 100px;
            margin: 10px;
        }
        .logo div{
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 2px 2px 5px #000000;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sign_in_up button{
            border-radius: 100px;
            margin: 10px;
            text-align: center;
            width: 100px;
            padding: 7px;
            border: none;
            font-weight: bold;
        }
        .sign_in_up button[name="sign_in"]{
            color :#003049;
            background-color: #ffffff;
            box-shadow: 2px 5px 5px #000000;
        }
        .sign_in_up button[name="sign_up"]{
            background-color: #c1121f;
            color: white;
            box-shadow: 2px 5px 5px #000000;
        }
        nav {
            display: flex;
            background-color: #1656af;
            align-items: center;
            max-width: 800px;
            margin: auto;
            width: 100%;
            border-radius: 20px;
            margin-bottom: 15px;
        }
        nav a{
            display: block;
            padding: 13px 30px;
            text-decoration: none;
            color: #FF003C;
            font-weight: bold;
            border-radius: 20px;
            text-shadow: 2px 2px 5px#000000;
        }
        nav a:hover{
            background-color:#c1121f;
            color: #ffffff;
            text-shadow: 2px 2px 5px#000000;
        }
       
        .quang_cao_phim{
            position: relative;
            width: 100%;
            height: 500px;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 500px;
            object-fit: cover;
            z-index: 1;
            filter: brightness(0.5)
        }
        .slide_container {
            width: 800px;
            height: 400px;
            overflow: hidden;
            position: relative;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 5px solid #000;
        }
        .slide_track {
            display: flex;
            transition: transform 0.8s ease-in-out;
        }
        .poster_landscape {
            width: 800px;
            flex-shrink: 0;
        }
        .poster_landscape img{
            width: 100%;
            height: 400px;
            object-fit: cover;
            display: block;
        }
        .slide_dots{
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 20;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: rgba(255,255,255,0.35);
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active {
            background-color: rgba(255,255,255,0.95);
        }

        .phim_hot{
            max-width: 800px;
            margin: 20px auto;
            background-color: #000000;
            border-radius: 15px;
            padding: 20px;
        }
        .tieu_de_phim_hot{
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px ;
            border-left: 5px solid #c1121f;
            padding-left: 10px;
            padding-bottom: 15px;
            border-bottom: 2px solid #c1121f;
        }
        .danh_sach_phim_hot {
            display: flex;
            gap: 15px;
            overflow: hidden;
        }
        .poster_portrait{
            flex: 1;
            position: relative;
            border-radius: 10px;
        }
        .poster_portrait img{
            width: 150px;
            height: 220px;
            object-fit: cover;
            display: block;
            border-radius: 10px;
        }
        .sott{
            position: absolute;
            bottom: 0px;
            left: -10px;
            font-size: 72px;
            font-weight: bold;
            color: white;
            line-height: 1;
            text-shadow: 3px 3px 10px rgb(0, 0, 0), -1px -1px 5px rgb(0, 0, 0);;
            z-index: 10;
        }

        
        footer {
            width: 100%;
            margin: 30px 0 0 0;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            padding: 25px 20px;
            box-sizing: border-box;
            position: relative;
        }
        footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .footer_rap {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }
        .footer_rap span {
            color: rgba(255,255,255,0.6);
            font-size: 13px;
            font-weight: bold;
        }
        .footer_main {
            display: flex;
            gap: 20px;
            justify-content: space-between;
        }
        .footer_logo img {
            height: 70px;
        }
        .footer_logo p {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
        }
        .footer_social h4, .footer_links h4 {
            color: white;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            border-left: 3px solid #c1121f;
            padding-left: 8px;
        }
        .footer_social a, .footer_links a {
            display: block;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 13px;
            margin-bottom: 6px;
        }
        .footer_social a:hover, .footer_links a:hover {
            color: white;
        }
        .footer_bottom {
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .footer_social a img{
            width: 20px;
            height: 20px;
            object-fit: contain;
            vertical-align: middle;
            margin-right: 6px;
        }

        
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="logo.png">
            <div>ĐẶT VÉ XEM PHIM ONLINE</div>
        </div>
        <div class="sign_in_up">
            <button name="sign_in">Đăng nhập</button>
            <button name="sign_up">Đăng ký</button>
        </div>
    </header>
    <nav class="chuyen_tab">
        <a href="trang_chu">TRANG CHỦ</a>
        <a href="phim">PHIM</a>
        <a href="khuyen_mai">KHUYẾN MÃI</a>
        <a href="lien_he">LIÊN HỆ</a>
    </nav>
    <div class="quang_cao_phim">
        <img src="background.jpg" class="background">
        <div class="slide_container">
            <div class="slide_track">
                <div class="poster_landscape"><img src="quynhaptrang2.jpg"></div>
                <div class="poster_landscape"><img src="cunhaykidieu.jpg"></div>
                <div class="poster_landscape"><img src="henemngaynhatthuc.jpg"></div>
                <div class="poster_landscape"><img src="cobecorenalin.jpg"></div>
            </div>
        </div>

        <div class="slide_dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
    <div class="phim_hot">
        <div class="tieu_de_phim_hot">🔥PHIM ĐANG HOT🔥</div>
        <div class="danh_sach_phim_hot">
            <div class="poster_portrait">
                <img src="phim 1.jpeg">
                <div class="sott">1</div>
            </div>
            <div class="poster_portrait">
                <img src="phim 2.jpg">
                <div class="sott">2</div>
            </div>
            <div class="poster_portrait">
                <img src="phim 3.jpg">
                <div class="sott">3</div>
            </div>
            <div class="poster_portrait">
                <img src="phim 4.jpg">
                <div class="sott">4</div>
            </div>
        </div>
    </div>
    <footer>
        <div style="max-width: 800px; margin: auto; position: relative; z-index: 1;">
            <div class="footer_rap">
                <span>🎬 CGV</span>
                <span>🎬 Rạp Chiếu Phim Quốc Gia</span>
            </div>
            <div class="footer_main">
                <div class="footer_logo">
                    <img src="logo.png">
                    <p>© 2026 All rights reserved</p>
                </div>
                <div class="footer_social">
                    <h4>MẠNG XÃ HỘI</h4>
                    <a href="#"><img src="facebook.png"> Facebook</a>
                    <a href="#"><img src="instagram.png"> Instagram</a>
                    <a href="#"><img src="youtube.png"> Youtube</a>
                </div>
                <div class="footer_links">
                    <h4>LIÊN KẾT NHANH</h4>
                    <a href="trang_chu">Trang chủ</a>
                    <a href="phim">Phim</a>
                    <a href="khuyen_mai">Khuyến mãi</a>
                    <a href="lien_he">Liên hệ</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const track = document.querySelector('.slide_track');
        const dots = document.querySelectorAll('.dot');
        const total = dots.length;
        let current = 0;

        function goTo(index) {
            current = index;
            track.style.transform = `translateX(-${index * 100}%)`;
            dots.forEach((d, i) =>
            d.classList.toggle('active', i === index));
        }

        dots.forEach((dot, i) =>
            dot.addEventListener('click', () => goTo(i)));

        setInterval(() => {
            goTo((current + 1) % total);
        }, 5000);
    </script>
</body>
</html>
